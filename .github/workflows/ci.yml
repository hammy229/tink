name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commits:
    name: Conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check commit subjects
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          bad=$(git log --format=%s "origin/$BASE_REF..HEAD" \
            | grep -vE '^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-z0-9-]+\))?!?: .+' || true)
          if [ -n "$bad" ]; then echo "Not conventional:"; echo "$bad"; exit 1; fi

  python:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run mypy
      - name: Cache the model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-voc2vec-hubert-ls-pt-v1
      - run: uv run pytest --cov --cov-report=term-missing --cov-fail-under=85
